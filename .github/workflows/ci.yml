name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Linux runners have no display; Xvfb lets the Swing smoke checks run instead of skipping.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check --no-daemon --stacktrace

      - name: Build and check (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check --no-daemon --stacktrace
